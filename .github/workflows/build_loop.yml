name: 4. Build Loop Manual
run-name: Build Loop Manual (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Loop App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Loop Local IPA File
        run: |
          ./gradlew build || true
          mkdir -p build/Payload
          xcrun xcodebuild -workspace LoopWorkspace.xcworkspace -scheme Loop -configuration Release -destination "generic/platform=iOS" archive -archivePath build/Loop.xcarchive CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" || true
          
      - name: Package Binary Artifacts
        run: |
          cp -r build/Loop.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || true
          cd build && zip -r Loop-Sideload.ipa Payload || true

      - name: Send File to Windows PC
        uses: actions/upload-artifact@v4
        with:
          name: Loop-Unsigned-Package
          path: |
            build/Loop-Sideload.ipa
            **/*.ipa
