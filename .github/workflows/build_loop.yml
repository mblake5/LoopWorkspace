name: 4. Build Loop Manual
run-name: Build Loop Manual (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Unsigned Loop App
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer"
      
      - name: Checkout Code Base and All Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Ruby Environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Project Dependencies
        run: |
          gem install bundler
          bundle install

      - name: Force Clean Build Without Code Signing
        run: |
          xcodebuild archive \
            -workspace LoopWorkspace.xcworkspace \
            -scheme Loop \
            -configuration Release \
            -archivePath build/Loop.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Binary Into Raw IPA Folder
        run: |
          mkdir -p build/Payload
          cp -r build/Loop.xcarchive/Products/Applications/Loop.app build/Payload/ || cp -r build/Loop.xcarchive/Products/Applications/LoopWorkspace.app build/Payload/
          cd build
          zip -r Loop-Unsigned.ipa Payload

      - name: Send Raw IPA File to Windows Artifact Tray
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loop-MDI-Sideload-File
          path: build/Loop-Unsigned.ipa
